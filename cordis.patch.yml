# 一次性安装使用的装配模板；安装器将相对入口与会话根改成目标绝对路径。
# 普通 plugin.js 与浏览器半边由作者 data/plugins 扫描装载，不再声明 profile bundle。
- id: session-persistence-jsonl
  disabled: true
- id: dsh-tavern
  disabled: true
- insert:
    - id: dsh-tavern-sqlite-v2
      name: ./bootstrap/session-persistence.js
      config:
        root: !!js dshHomePath('profile-data', 'tavern', 'sessions')
    - id: dsh-tavern-storage-host-patch-v2
      name: ./bootstrap/host-patch.js
    - id: dsh-tavern-storage-standard-host-v2
      name: ./bootstrap/standard-host.js
      inject:
        - loader
        - sessionPersistence
        - tavernStorageBootstrapReady
      config:
        persistedSeams: true
